name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Guard — no @tanstack/* dependency
        run: npm run guard:tanstack

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (no warnings)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time env so server modules that read env don't fail to compile.
          KICKS_SECRET: ci-placeholder
          WOO_BASE_URL: https://example.com
          WOO_CONSUMER_KEY: ck_ci
          WOO_CONSUMER_SECRET: cs_ci
          DATABASE_URL: postgres://kicks:kicks@localhost:5432/kicks
          REDIS_URL: redis://localhost:6379

  # The Vetrina on its demo shop, in a browser on a phone's screen: the flows
  # an owner taps through (e2e/), against a fresh database. Nothing reaches a
  # real shop.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hub_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Build
        run: npm run build
        env:
          KICKS_SECRET: ci-placeholder
          WOO_BASE_URL: https://example.com
          WOO_CONSUMER_KEY: ck_ci
          WOO_CONSUMER_SECRET: cs_ci
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hub_e2e
          REDIS_URL: redis://localhost:6379

      - name: Browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo shop)
        run: npm run test:e2e

      - name: Report, when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
